<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Coffee house</title>
</head>
<body>
  <div class="container">
    <header class="header font-nav-link">
      <div class="header-logo">
        <a href="#">
          <img src="/assets/img/logo.png" alt="Coffee house logo">
        </a>
      </div>
      <nav class="header-nav">
        <ul class="header-nav-list">
          <li><a href="#">Favorite coffee</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Mobile app</a></li>
          <li><a href="#">Contact us</a></li>
        </ul>
      </nav>
      <div class="header-buttons">
        <button class="header-switch">
          <img class="header-switch_btn sun" src="/assets/img/Sun.png" alt="">
          <img class="header-switch_btn moon" src="/assets/img/Moon.png" alt="">
        </button>
        <div class="header-menu_btn">
          <span class="header-menu_btn_title">Menu</span>
          <img class="header-menu_btn_img" src="/assets/img/coffee-cup.png" alt="">
        </div>
      </div>
    </header>
    <main>
      <p>Welcome to the Coffee house</p>
    </main>
    <footer>
      <p>Copyright 2021</p>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
