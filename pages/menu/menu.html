<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/home.css">
  <link rel="stylesheet" href="/styles/menu.css">
  <title>Coffee house</title>
</head>
<body>
  <div class="container">
    <header class="header font-nav-link">
      <div class="header-logo">
        <a href="/pages/home/index.html">
          <img src="/assets/img/logo.png" alt="Coffee house logo">
        </a>
      </div>
      <nav class="header-nav">
        <ul class="header-nav-list">
          <li><a href="#">Favorite coffee</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Mobile app</a></li>
          <li><a href="#">Contact us</a></li>
        </ul>
      </nav>
      <div class="header-buttons">
        <button class="header-switch">
          <img class="header-switch_btn sun" src="/assets/img/Sun.png" alt="">
          <img class="header-switch_btn moon" src="/assets/img/Moon.png" alt="">
        </button>
        <a class="header-menu_btn">
          <span class="header-menu_btn_title">Menu</span>
          <img class="header-menu_btn_img" src="/assets/img/coffee-cup.png" alt="">
        </a>
      </div>
    </header>
    <main class="menu">
      <p>Menu</p>
    </main>
  </div>

<script src="/scripts/global.js"></script>

</html>
